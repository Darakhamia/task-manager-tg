services:
  bot:
    build: .
    container_name: task-manager-tg
    restart: unless-stopped
    ports:
      - "${PORT:-8443}:${PORT:-8443}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./certs:/app/certs:ro
    tmpfs:
      - /tmp:size=256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
