services:
  bot:
    build: .
    container_name: task-manager-tg
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./certs:/app/certs:ro
      - ./data:/app/data
    tmpfs:
      - /tmp:size=256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.task-manager-tg.rule=Host(`tasks.polyglot.sbs`)"
      - "traefik.http.routers.task-manager-tg.entrypoints=websecure"
      - "traefik.http.routers.task-manager-tg.tls.certresolver=letsencrypt"
      - "traefik.http.services.task-manager-tg.loadbalancer.server.port=${PORT:-8443}"
      - "traefik.http.services.task-manager-tg.loadbalancer.server.scheme=https"
      - "traefik.http.services.task-manager-tg.loadbalancer.serversTransport=insecure@internal"

networks:
  traefik-public:
    external: true
